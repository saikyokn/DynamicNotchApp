name: Build Simulator Package for Appetize

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project DynamicNotchApp.xcodeproj \
                     -scheme DynamicNotchApp \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package into Zip for Appetize
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphonesimulator -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r DynamicNotch-Simulator.zip Payload
          rm -rf Payload build

      - name: Upload Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicNotch-Simulator
          path: DynamicNotch-Simulator.zip
